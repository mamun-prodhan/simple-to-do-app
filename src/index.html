<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="todo-section">
            <div class="container">
                <article class="todo-app">
                    <h2>To Do List <img src="./images/icon.png" alt="To Do Icon"></h2>
                    <div class="row">
                        <input type="text" name="todo" id="input-box" placeholder="Add a task" aria-label="Add a task">
                        <button onclick="addTask()">Add</button>
                    </div>
                    <ul id="list-container" aria-label="To Do List">
                        <!-- <li class="checked">Task 1</li>
                        <li>Task 2</li>
                        <li>Task 3</li> -->
                    </ul>
                </article>
            </div>
        </section>
    </main>
    <!-- <script src="bundle.js"></script> -->
</body>
</html>
